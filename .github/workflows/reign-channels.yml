name: Reign channels and client version
on:
  pull_request:
    branches: [unstable, dev, reign]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify promotion path
        env:
          TARGET_BRANCH: ${{ github.base_ref }}
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: |
          case "$TARGET_BRANCH" in
            dev) test "$SOURCE_BRANCH" = unstable ;;
            reign) test "$SOURCE_BRANCH" = dev ;;
            unstable) : ;;
            *) exit 1 ;;
          esac
      - name: Check module and assembly version agreement
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          project = ET.parse('ReignBeta/ReignBeta.csproj')
          module = ET.parse('ReignBeta/SubModule.xml')
          version = project.findtext('.//Version')
          assert version and module.find('.//Version').get('value').lstrip('v') == version
          assert project.findtext('.//AssemblyVersion') == version + '.0'
          PY
