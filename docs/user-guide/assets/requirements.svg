<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" role="img" aria-labelledby="title desc"><title id="title">Your PC and the cloud providers</title><desc id="desc">Bannerlord connects to the local Reign server and memory services. That server sends dialogue to a required cloud LLM provider. New optional images use a separately configured cloud image provider. Both cloud routes require internet and provider access.</desc><rect width="1120" height="400" rx="8" fill="#121211"/><g font-family="Georgia,serif" fill="#C5BDAF"><text x="32" y="40" font-size="22">Your PC runs Reign. Cloud providers generate new AI content.</text><g stroke="#7E6A4D" fill="#171717"><rect x="35" y="106" width="225" height="177" rx="6"/><rect x="310" y="106" width="300" height="177" rx="6"/><rect x="710" y="80" width="365" height="106" rx="6"/><rect x="710" y="223" width="365" height="106" rx="6"/></g><g font-size="22"><text x="60" y="149">Bannerlord + Reign</text><text x="335" y="149">Local Reign server</text><text x="735" y="118">Cloud LLM provider</text><text x="735" y="261">Cloud image provider</text></g><g font-family="Arial,sans-serif" font-size="18"><text x="60" y="186">Game, battles, UI</text><text x="60" y="217">and native actions</text><text x="335" y="186">Database, memory worker,</text><text x="335" y="217">campaign state and routing</text><text x="735" y="155">Required for AI dialogue</text><text x="735" y="298">Needed for optional new AI images</text><text x="35" y="367">Local hardware still needs room for the game AND Reign's services.</text></g></g><g fill="none" stroke="#A88A54" stroke-width="2"><path d="M260,195 H310"/><path d="M610,195 H660 V133 H710"/><path d="M660,195 V276 H710"/></g></svg>