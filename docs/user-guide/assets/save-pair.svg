<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 300" role="img" aria-labelledby="title desc"><title id="title">Keep the matching save pair</title><desc id="desc">Native save: Bannerlord records its campaign state.. Reign snapshot: Save Sync links matching memories and server state.. Protected point: Both parts share the recorded save identity.. Restore: Load the matched point, not unrelated later memory.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#A88A54"/></marker></defs>
<rect width="1120" height="300" rx="8" fill="#121211"/>
<text x="32" y="38" fill="#C5BDAF" font-family="Georgia,serif" font-size="22">Keep the matching save pair</text>
<rect x="28" y="70" width="230" height="194" rx="6" fill="#171717" stroke="#7E6A4D"/>
<text x="46" y="103" fill="#C5AC83" font-family="Georgia,serif" font-size="19">Native save</text>
<text x="46" y="134" fill="#C5BDAF" font-family="Arial,sans-serif" font-size="16">Bannerlord records its</text>
<text x="46" y="157" fill="#C5BDAF" font-family="Arial,sans-serif" font-size="16">campaign state.</text>
<path d="M264,163 H295" fill="none" stroke="#A88A54" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="306" y="70" width="230" height="194" rx="6" fill="#171717" stroke="#7E6A4D"/>
<text x="324" y="103" fill="#C5AC83" font-family="Georgia,serif" font-size="19">Reign snapshot</text>
<text x="324" y="134" fill="#C5BDAF" font-family="Arial,sans-serif" font-size="16">Save Sync links matching</text>
<text x="324" y="157" fill="#C5BDAF" font-family="Arial,sans-serif" font-size="16">memories and server</text>
<text x="324" y="180" fill="#C5BDAF" font-family="Arial,sans-serif" font-size="16">state.</text>
<path d="M542,163 H573" fill="none" stroke="#A88A54" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="584" y="70" width="230" height="194" rx="6" fill="#171717" stroke="#7E6A4D"/>
<text x="602" y="103" fill="#C5AC83" font-family="Georgia,serif" font-size="19">Protected point</text>
<text x="602" y="134" fill="#C5BDAF" font-family="Arial,sans-serif" font-size="16">Both parts share the</text>
<text x="602" y="157" fill="#C5BDAF" font-family="Arial,sans-serif" font-size="16">recorded save identity.</text>
<path d="M820,163 H851" fill="none" stroke="#A88A54" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="862" y="70" width="230" height="194" rx="6" fill="#171717" stroke="#7E6A4D"/>
<text x="880" y="103" fill="#C5AC83" font-family="Georgia,serif" font-size="19">Restore</text>
<text x="880" y="134" fill="#C5BDAF" font-family="Arial,sans-serif" font-size="16">Load the matched point,</text>
<text x="880" y="157" fill="#C5BDAF" font-family="Arial,sans-serif" font-size="16">not unrelated later</text>
<text x="880" y="180" fill="#C5BDAF" font-family="Arial,sans-serif" font-size="16">memory.</text>
</svg>