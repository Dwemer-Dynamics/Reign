<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 300" role="img" aria-labelledby="title desc"><title id="title">What happened is not what everyone knows</title><desc id="desc">Event: Something actually happens in the campaign.. Witness: A participant learns what they experienced.. Report: Other people hear a delivered account later.. Belief: An account may be true, uncertain or false.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#A88A54"/></marker></defs>
<rect width="1120" height="300" rx="8" fill="#121211"/>
<text x="32" y="38" fill="#C5BDAF" font-family="Georgia,serif" font-size="22">What happened is not what everyone knows</text>
<rect x="28" y="70" width="230" height="194" rx="6" fill="#171717" stroke="#7E6A4D"/>
<text x="46" y="103" fill="#C5AC83" font-family="Georgia,serif" font-size="19">Event</text>
<text x="46" y="134" fill="#C5BDAF" font-family="Arial,sans-serif" font-size="16">Something actually</text>
<text x="46" y="157" fill="#C5BDAF" font-family="Arial,sans-serif" font-size="16">happens in the campaign.</text>
<path d="M264,163 H295" fill="none" stroke="#A88A54" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="306" y="70" width="230" height="194" rx="6" fill="#171717" stroke="#7E6A4D"/>
<text x="324" y="103" fill="#C5AC83" font-family="Georgia,serif" font-size="19">Witness</text>
<text x="324" y="134" fill="#C5BDAF" font-family="Arial,sans-serif" font-size="16">A participant learns</text>
<text x="324" y="157" fill="#C5BDAF" font-family="Arial,sans-serif" font-size="16">what they experienced.</text>
<path d="M542,163 H573" fill="none" stroke="#A88A54" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="584" y="70" width="230" height="194" rx="6" fill="#171717" stroke="#7E6A4D"/>
<text x="602" y="103" fill="#C5AC83" font-family="Georgia,serif" font-size="19">Report</text>
<text x="602" y="134" fill="#C5BDAF" font-family="Arial,sans-serif" font-size="16">Other people hear a</text>
<text x="602" y="157" fill="#C5BDAF" font-family="Arial,sans-serif" font-size="16">delivered account later.</text>
<path d="M820,163 H851" fill="none" stroke="#A88A54" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="862" y="70" width="230" height="194" rx="6" fill="#171717" stroke="#7E6A4D"/>
<text x="880" y="103" fill="#C5AC83" font-family="Georgia,serif" font-size="19">Belief</text>
<text x="880" y="134" fill="#C5BDAF" font-family="Arial,sans-serif" font-size="16">An account may be true,</text>
<text x="880" y="157" fill="#C5BDAF" font-family="Arial,sans-serif" font-size="16">uncertain or false.</text>
</svg>