<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 300" role="img" aria-labelledby="title desc"><title id="title">From words to a real result</title><desc id="desc">Propose: Name the person, action and exact terms.. Agree: Both sides accept the same version.. Check: Authority, resources and current safety must allow it.. Observe: Read the result and check what the game actually did.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#A88A54"/></marker></defs>
<rect width="1120" height="300" rx="8" fill="#121211"/>
<text x="32" y="38" fill="#C5BDAF" font-family="Georgia,serif" font-size="22">From words to a real result</text>
<rect x="28" y="70" width="230" height="194" rx="6" fill="#171717" stroke="#7E6A4D"/>
<text x="46" y="103" fill="#C5AC83" font-family="Georgia,serif" font-size="19">Propose</text>
<text x="46" y="134" fill="#C5BDAF" font-family="Arial,sans-serif" font-size="16">Name the person, action</text>
<text x="46" y="157" fill="#C5BDAF" font-family="Arial,sans-serif" font-size="16">and exact terms.</text>
<path d="M264,163 H295" fill="none" stroke="#A88A54" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="306" y="70" width="230" height="194" rx="6" fill="#171717" stroke="#7E6A4D"/>
<text x="324" y="103" fill="#C5AC83" font-family="Georgia,serif" font-size="19">Agree</text>
<text x="324" y="134" fill="#C5BDAF" font-family="Arial,sans-serif" font-size="16">Both sides accept the</text>
<text x="324" y="157" fill="#C5BDAF" font-family="Arial,sans-serif" font-size="16">same version.</text>
<path d="M542,163 H573" fill="none" stroke="#A88A54" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="584" y="70" width="230" height="194" rx="6" fill="#171717" stroke="#7E6A4D"/>
<text x="602" y="103" fill="#C5AC83" font-family="Georgia,serif" font-size="19">Check</text>
<text x="602" y="134" fill="#C5BDAF" font-family="Arial,sans-serif" font-size="16">Authority, resources and</text>
<text x="602" y="157" fill="#C5BDAF" font-family="Arial,sans-serif" font-size="16">current safety must</text>
<text x="602" y="180" fill="#C5BDAF" font-family="Arial,sans-serif" font-size="16">allow it.</text>
<path d="M820,163 H851" fill="none" stroke="#A88A54" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="862" y="70" width="230" height="194" rx="6" fill="#171717" stroke="#7E6A4D"/>
<text x="880" y="103" fill="#C5AC83" font-family="Georgia,serif" font-size="19">Observe</text>
<text x="880" y="134" fill="#C5BDAF" font-family="Arial,sans-serif" font-size="16">Read the result and</text>
<text x="880" y="157" fill="#C5BDAF" font-family="Arial,sans-serif" font-size="16">check what the game</text>
<text x="880" y="180" fill="#C5BDAF" font-family="Arial,sans-serif" font-size="16">actually did.</text>
</svg>